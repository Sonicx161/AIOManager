<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    // Paint the last theme background before any CSS or module loads (no white flash).
    (function () {
      var bg = '#09090b'
      try {
        var saved = localStorage.getItem('aio-boot-bg')
        if (/^#[0-9a-f]{3,8}$/i.test(saved || '')) bg = saved
      } catch (e) {}
      document.documentElement.style.backgroundColor = bg
      var style = document.createElement('style')
      style.id = 'aio-boot-paint'
      style.textContent = 'html body{background-color:' + bg + '}'
      document.head.appendChild(style)
    })()
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AIOManager</title>

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
