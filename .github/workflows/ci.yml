name: CI

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API contract drift check
        run: |
          npm --prefix server ci
          npm run generate:api
          git diff --exit-code server/openapi.json src/api/schema.d.ts || {
            echo "::error::server/openapi.json or src/api/schema.d.ts drifted from the server routes. Run 'npm run generate:api' and commit the results."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Built app boots in a real browser
        run: npm run test:boot
        env:
          ENCRYPTION_KEY: test-encryption-key-32bytes-long!!
      - name: Server smoke tests (static serving, sync, hydra)
        run: npm --prefix server run test:smoke
        env:
          ENCRYPTION_KEY: test-encryption-key-32bytes-long!!
