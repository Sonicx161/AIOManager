name: CI

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]

jobs:
  client:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiomanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API contract drift check
        run: |
          npm --prefix server ci
          npm run generate:api
          git diff --exit-code server/openapi.json src/api/schema.d.ts || {
            echo "::error::server/openapi.json or src/api/schema.d.ts drifted from the server routes. Run 'npm run generate:api' and commit the results."
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Boot transfer budget and CSP hash check
        run: npm run check:boot-budget
      - name: Built app boots in a real browser
        run: npm run test:boot
        env:
          ENCRYPTION_KEY: test-encryption-key-32bytes-long!!
      - name: Server smoke tests (static serving, sync, hydra)
        run: npm --prefix server run test:smoke
        env:
          ENCRYPTION_KEY: test-encryption-key-32bytes-long!!
      - name: Server smoke tests on PostgreSQL (boot, health, sync round trip)
        run: npm --prefix server run test:smoke
        env:
          ENCRYPTION_KEY: test-encryption-key-32bytes-long!!
          DB_TYPE: postgres
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aiomanager_test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/aiomanager_test
          SMOKE_SERVER_PORT: '17771'
